## ── Backend service for the demo ─────────────────────────────────────────────
## Usage:  docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
##
## This file EXTENDS the base docker-compose.yml (postgres + nats).
## It adds the Trustline backend built from the repo Dockerfile, configured
## with TEST_MODE=1 so the /api/v1/test/bootstrap endpoint is available.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustline-backend
    environment:
      DATABASE_URL: "postgres://trustline:trustline_dev@postgres:5432/trustline"
      JWT_SECRET: "demo-jwt-secret-not-for-production"
      NATS_URL: "nats://nats:4222"
      FRONTEND_URL: "http://localhost:1420"
      CORS_ALLOWED_ORIGINS: "http://localhost:1420,http://localhost:5173,http://localhost:3000,tauri://localhost"
      TEST_MODE: "1"
      RUST_LOG: "info"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - trustline-net
