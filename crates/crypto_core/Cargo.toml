[package]
name = "crypto_core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sodiumoxide = "0.2.7"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
